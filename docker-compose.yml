services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: datapilot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: datapilot
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: datapilot

    ports:
      - "5433:5432"

    volumes:
      - datapilot_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot -d datapilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: datapilot-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  datapilot_postgres_data:
  qdrant_storage: